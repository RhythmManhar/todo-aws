name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Check Files and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository files
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Assessment Basic Test - Check that index.html exists
      - name: Check that index.html exists
        run: |
          if [ -f index.html ]; then
            echo "SUCCESS: index.html exists"
          else
            echo "ERROR: index.html is missing!"
            exit 1
          fi

      # Step 3: Check that style.css exists
      - name: Check that style.css exists
        run: |
          if [ -f style.css ]; then
            echo "SUCCESS: style.css exists"
          else
            echo "ERROR: style.css is missing!"
            exit 1
          fi

      # Step 4: Check that script.js exists
      - name: Check that script.js exists
        run: |
          if [ -f script.js ]; then
            echo "SUCCESS: script.js exists"
          else
            echo "ERROR: script.js is missing!"
            exit 1
          fi

      # Step 5: Set up Node.js to run tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 6: Install dependencies and run tests
      - name: Run tests
        run: |
          npm install
          npm test

      # Step 7: Build the Docker image (verifies Dockerfile and packaging work)
      - name: Build the Docker image
        run: |
          echo "Building Docker image todo-aws..."
          docker build -t todo-aws .
          echo "SUCCESS: Docker image built successfully!"